spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  upload-folder: "uploads/"
  domain: ${APP_DOMAIN}
  admin:
    credentials:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}