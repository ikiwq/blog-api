name: Deploy Blog Api on Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t blogapi:latest .

      - name: Deploy Docker container
        run: |
          docker stop blogapi-container || true
          docker rm blogapi-container || true
          docker run -d \
          -e ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} \
          -e ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }} \
          -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
          -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
          -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
          -e DOMAIN=${{ secrets.DOMAIN }} \
          --name blogapi-container blogapi:latest